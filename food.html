<!DOCTYPE html>
<html lang="en">

<head>
  <title>Dinner Time</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
    integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
    integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
    crossorigin="anonymous"></script>

</head>

<body>
  <h1>Dinner time by Hana Tolera</h1>
  <div class="container">
    <div class="row">
      <div class="col-sm-2">T</div>
      <div class="col-sm-2">O</div>
      <div class="col-sm-2">L</div>
      <div class="col-sm-2">E</div>
      <div class="col-sm-2">R</div>
      <div class="col-sm-2">A</div>

    </div>
    <div class="row">
      <div class="col-md">Tacos</div>
      <div class="col-md">Omelette</div>
      <div class="col-md">Lasagna</div>
      <div class="col-md">Eggs</div>
      <div class="col-md">Rice</div>
      <div class="col-md">Alfredo</div>

    </div>
    <p>
      The foods row breaks first because it uses col-md, while the letters use col-sm-2.
    </p>
    <div class="container">
      <img src="Tacos.jpg" class="img-fluid" alt="Tacos" width="300" height="400">

      <img src="Lasagna.jpg" class="img-fluid" alt="Lasagna" width="300" height="400">

      <img src="Rice.jpg" class="img-fluid" alt="Rice" width="300" height="400">

    </div>
    <div class="container">
      <img src="Tacos.jpg" class="img-thumbnail" alt="Tacos" width="150" height="150">
      <img src="Lasagna.jpg" class="img-thumbnail" alt="Lasagna" width="150" height="150">
      <img src="Rice.jpg" class="img-thumbnail" alt="Rice" width="150" height="150">
    </div>

  </div>


</body>

</html>
